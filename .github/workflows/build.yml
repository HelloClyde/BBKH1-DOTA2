name: Build H1 DOTA2

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned Python dependencies
        shell: pwsh
        run: |
          python -m pip install -r tools/requirements-build.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install SHA-verified GNU MIPS toolchain
        shell: pwsh
        run: |
          python tools/install_toolchain.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build exact standalone BDA
        shell: pwsh
        run: |
          python tools/build.py --output build/native
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify envelope, ELF payload, ABI and reference SHA
        shell: pwsh
        run: |
          python tools/verify.py --build build/native
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Select development or pinned release delivery
        id: delivery
        shell: pwsh
        run: |
          $deliveryVersion = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $deliveryPin = Join-Path provenance/releases ("v" + $deliveryVersion + ".json")
          $deliveryPinned = Test-Path -LiteralPath $deliveryPin -PathType Leaf
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and -not $deliveryPinned) {
            throw "A version tag requires a verified release pin."
          }
          $deliveryValue = if ($deliveryPinned) { 'true' } else { 'false' }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "pinned=$deliveryValue"
      - name: Package and verify explicit delivery members
        if: steps.delivery.outputs.pinned == 'true'
        shell: pwsh
        run: |
          python tools/package.py --build build/native --output dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/verify.py --package dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        if: steps.delivery.outputs.pinned == 'true'
        with:
          name: DOTA2-H1-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@v7
        if: steps.delivery.outputs.pinned != 'true'
        with:
          name: DOTA2-H1-${{ github.sha }}
          path: |
            build/native/DOTA2.bda
            build/native/DOTA2.build.json
            build/native/DOTA2.bda.sha256
            assets/runtime/DOTA2.H1R
            docs/CONTROLS.md
            README.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          name: DOTA2-H1-${{ github.sha }}
          path: dist
          digest-mismatch: error
      - name: Verify downloaded files and tag, without rebuilding
        run: |
          python tools/verify.py --package dist
          python tools/check_tag.py
      - name: Read release channel
        id: channel
        run: |
          python -c "import json,pathlib; v=pathlib.Path('VERSION').read_text().strip(); p=json.loads(pathlib.Path('provenance/releases/v'+v+'.json').read_text()); flag=p.get('prerelease', True); assert isinstance(flag, bool); print('prerelease='+str(flag).lower())" >> "$GITHUB_OUTPUT"
      - name: Publish this build only for an explicitly pushed version tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: |
          release_options=()
          if [ "$RELEASE_PRERELEASE" = 'true' ]; then
            release_options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/DOTA2-H1-install.zip dist/DOTA2.bda dist/SHA256SUMS.txt dist/PACKAGE.json --verify-tag --title "DOTA2 $RELEASE_TAG" --notes-file RELEASE-NOTES.md "${release_options[@]}"
